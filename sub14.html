<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>협동 보스 계산기</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
}

.header {
  text-align: center;
  font-size: 30px;
  padding: 20px;
  font-weight: bold;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

input, button {
  width: 100%;
  height: 45px;
  margin: 8px 0;
  font-size: 16px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #4CAF50;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  text-align: center;
}

.big {
  font-size: 24px;
  font-weight: bold;
}
</style>

<script>
const bosses = [
  "뱀", "침묵", "기사", "매지션", "레온",
  "해킹", "슬라임", "그래비터", "바실리스크"
];

function getBoss(wave) {
  if (wave < 5) return "보스 없음";

  // 1차 등장 (5 ~ 45)
  if (wave <= 45) {
    if (wave % 5 !== 0) return "일반 웨이브";
    let idx = (wave / 5) - 1;
    return bosses[idx];
  }

  // 2차 이후 (2웨이브 간격)
  let idx = Math.floor((wave - 46) / 2);

  if (idx < 0) return "보스 대기 구간";

  return bosses[idx % bosses.length];
}

function calc() {
  let wave = Number(document.getElementById("wave").value);

  if (!wave || wave < 1) {
    alert("웨이브 입력");
    return;
  }

  let boss = getBoss(wave);

  document.getElementById("result").innerHTML =
    "웨이브: <span class='big'>" + wave +
    "</span><br>보스: <span class='big'>" + boss + "</span>";
}
</script>

</head>

<body>

<div class="header">협동 보스 계산기</div>

<div class="container">

<label>웨이브</label>
<input type="number" id="wave" placeholder="예: 5">

<button onclick="calc()">계산</button>

<div class="result" id="result">-</div>

</div>

</body>
</html>
